name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r backend/requirements.txt pytest flake8
      - name: Lint
        run: flake8 backend tests --max-line-length=120 --select=E9,F63,F7,F82
      - name: Train intent models
        run: python backend/train_intent_models.py
        working-directory: .
      - name: Test
        run: pytest -q
